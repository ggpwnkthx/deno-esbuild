name: "Publish Deno package"
description: "Run deno publish for one workspace member. Caller is responsible for checkout, Deno setup, and dependency caching. Honors the workflow_dispatch 'package' input."
inputs:
  package:
    description: "Workspace member directory (e.g. packages/esbuild)."
    required: true
runs:
  using: composite
  steps:
    - name: Select package
      if: ${{ github.event.inputs.package != '' && github.event.inputs.package != inputs.package }}
      shell: bash
      run: 'echo "Skipping ${{ inputs.package }} (selected: ${{ github.event.inputs.package }})"'

    - name: Publish
      if: ${{ github.event.inputs.package == '' || github.event.inputs.package == inputs.package }}
      working-directory: ${{ inputs.package }}
      shell: bash
      run: deno publish
