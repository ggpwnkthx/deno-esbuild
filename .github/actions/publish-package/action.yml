name: "Publish Deno package"
description: "Run deno publish for one workspace member with OIDC + bundle diagnostic logging. Caller is responsible for checkout, Deno setup, and dependency caching. Honors the workflow_dispatch 'package' input."
inputs:
  package:
    description: "Workspace member directory (e.g. packages/esbuild)."
    required: true
runs:
  using: composite
  steps:
    - name: Select package
      if: ${{ github.event.inputs.package != '' && github.event.inputs.package != inputs.package }}
      shell: bash
      run: 'echo "Skipping ${{ inputs.package }} (selected: ${{ github.event.inputs.package }})"'

    - name: Diagnose OIDC environment
      if: ${{ github.event.inputs.package == '' || github.event.inputs.package == inputs.package }}
      shell: bash
      working-directory: ${{ inputs.package }}
      run: |
        {
          echo "--- OIDC env probe ---"
          echo "GITHUB_ACTIONS=${GITHUB_ACTIONS:-unset}"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo no)"
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-unset}"
          echo "GITHUB_WORKFLOW_REF=${GITHUB_WORKFLOW_REF:-unset}"
          echo "GITHUB_REF=${GITHUB_REF:-unset}"
          echo "GITHUB_SHA=${GITHUB_SHA:-unset}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID:-unset}"
          echo "RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unset}"
          echo "deno: $(deno --version | head -n1)"
          echo "cwd: $(pwd)"
          echo "deno.json name@version: $(jq -r '"@\(.name)@\(.version)"' deno.json 2>/dev/null || echo '<jq failed>')"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "--- OIDC audience=sigstore probe (Deno uses this audience per cli/tools/publish/provenance.rs) ---"
            curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" \
              -o /tmp/oidc.json -w 'http=%{http_code}\n' || echo "oidc probe failed"
            head -c 220 /tmp/oidc.json 2>/dev/null || true
            echo
          else
            echo "--- OIDC probe skipped: ACTIONS_ID_TOKEN_REQUEST_URL or ACTIONS_ID_TOKEN_REQUEST_TOKEN missing ---"
          fi
        } | tee /tmp/diagnose.log

    - name: Publish (capture output, preserve exit code)
      if: ${{ github.event.inputs.package == '' || github.event.inputs.package == inputs.package }}
      env:
        DENO_LOG: debug
      working-directory: ${{ inputs.package }}
      shell: bash
      run: |
        set -o pipefail
        deno publish 2>&1 | tee /tmp/publish.log
        exit "${PIPESTATUS[0]}"
