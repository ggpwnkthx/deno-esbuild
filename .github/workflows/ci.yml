name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: fmt (${{ matrix.package }})
    runs-on: ubuntu-latest
    env:
      DENO_VERSION: ${{ inputs.deno-version || '2.9.4' }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - packages/esbuild
          - packages/plugins/deno
          - packages/plugins/css
          - packages/wrappers/shared
          - packages/wrappers/hono
          - packages/wrappers/oak
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-
      - name: deno fmt --check
        working-directory: ${{ matrix.package }}
        run: deno fmt --check

  lint:
    name: lint (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: fmt
    env:
      DENO_VERSION: ${{ inputs.deno-version || '2.9.4' }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - packages/esbuild
          - packages/plugins/deno
          - packages/plugins/css
          - packages/wrappers/shared
          - packages/wrappers/hono
          - packages/wrappers/oak
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-
      - name: deno lint
        working-directory: ${{ matrix.package }}
        run: deno lint

  check:
    name: check (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: lint
    env:
      DENO_VERSION: ${{ inputs.deno-version || '2.9.4' }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - packages/esbuild
          - packages/plugins/deno
          - packages/plugins/css
          - packages/wrappers/shared
          - packages/wrappers/hono
          - packages/wrappers/oak
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-
      - name: deno check
        working-directory: ${{ matrix.package }}
        run: deno check

  audit:
    name: audit
    runs-on: ubuntu-latest
    needs: check
    env:
      DENO_VERSION: ${{ inputs.deno-version || '2.9.4' }}
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-
      - name: deno audit
        run: deno audit

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: audit
    env:
      DENO_VERSION: ${{ inputs.deno-version || '2.9.4' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/esbuild
            permissions: --allow-read --allow-write --allow-env --allow-run --allow-net=github.com,jsr.io
          - package: packages/plugins/deno
            permissions: --allow-read --allow-write --allow-env --allow-net --allow-run
          - package: packages/plugins/css
            permissions: --allow-read --allow-write --allow-env --allow-net --allow-run
          - package: packages/wrappers/shared
            permissions: --allow-read --allow-write
          - package: packages/wrappers/hono
            permissions: --allow-read --allow-write --allow-env --allow-run
          - package: packages/wrappers/oak
            permissions: --allow-read --allow-write --allow-env --allow-run
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-
      - name: deno test
        working-directory: ${{ matrix.package }}
        run: deno test ${{ matrix.permissions }}
