name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace member to publish (empty for all)"
        required: false
        type: string

env:
  DENO_VERSION: "2.9.4"

jobs:
  publish-base:
    name: publish-base (${{ matrix.package }})
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/esbuild
    steps:
      - uses: ./.github/actions/publish-package
        with:
          package: ${{ matrix.package }}

  publish-deps:
    name: publish-deps (${{ matrix.package }})
    needs: publish-base
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/wrappers/shared
          - packages/plugins/deno
          - packages/plugins/css
    steps:
      - uses: ./.github/actions/publish-package
        with:
          package: ${{ matrix.package }}

  publish-wrappers:
    name: publish-wrappers (${{ matrix.package }})
    needs: publish-deps
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/wrappers/hono
          - packages/wrappers/oak
    steps:
      - uses: ./.github/actions/publish-package
        with:
          package: ${{ matrix.package }}
