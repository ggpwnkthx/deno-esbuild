name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  publish-base:
    name: publish-base (${{ matrix.package }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/esbuild
    steps:
      - uses: actions/checkout@v6
      - name: Publish package
        working-directory: ${{ matrix.package }}
        run: deno publish

  publish-deps:
    name: publish-deps (${{ matrix.package }})
    needs: publish-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/wrappers/shared
          - packages/plugins/deno
          - packages/plugins/css
    steps:
      - uses: actions/checkout@v6
      - name: Publish package
        working-directory: ${{ matrix.package }}
        run: deno publish

  publish-wrappers:
    name: publish-wrappers (${{ matrix.package }})
    needs: publish-deps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/wrappers/hono
          - packages/wrappers/oak
    steps:
      - uses: actions/checkout@v6
      - name: Publish package
        working-directory: ${{ matrix.package }}
        run: deno publish
