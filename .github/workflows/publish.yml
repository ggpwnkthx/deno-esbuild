name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace member to publish (empty for all)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  DENO_VERSION: "2.9.4"

jobs:
  publish-base:
    name: publish-base (${{ matrix.package }})
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/esbuild
    steps:
      - name: Checkout CI run commit
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - uses: ./.github/actions/publish-package
        with:
          package: ${{ matrix.package }}

      - name: Inspect published version
        if: always()
        shell: bash
        working-directory: ${{ matrix.package }}
        run: |
          pkg=$(jq -r '.name' deno.json)
          ver=$(jq -r '.version' deno.json)
          scope=$(echo "$pkg" | awk -F/ '{print $1}' | tr -d '@')
          name=$(echo "$pkg" | awk -F/ '{print $2}')
          echo "--- JSR version API for ${pkg}@${ver} ---"
          curl -fsS "https://jsr.io/api/scopes/${scope}/packages/${name}/versions/${ver}" -o /tmp/version.json -w 'http=%{http_code}\n' || echo "(probe failed)"
          jq '{version, rekorLogId, usesNpm}' /tmp/version.json 2>/dev/null || cat /tmp/version.json
          echo "--- last 60 lines of /tmp/publish.log ---"
          tail -n 60 /tmp/publish.log 2>/dev/null || true
          echo "--- last 60 lines of /tmp/diagnose.log ---"
          tail -n 60 /tmp/diagnose.log 2>/dev/null || true

  publish-deps:
    name: publish-deps (${{ matrix.package }})
    needs: publish-base
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/wrappers/shared
          - packages/plugins/deno
          - packages/plugins/css
    steps:
      - name: Checkout CI run commit
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - uses: ./.github/actions/publish-package
        with:
          package: ${{ matrix.package }}

      - name: Inspect published version
        if: always()
        shell: bash
        working-directory: ${{ matrix.package }}
        run: |
          pkg=$(jq -r '.name' deno.json)
          ver=$(jq -r '.version' deno.json)
          scope=$(echo "$pkg" | awk -F/ '{print $1}' | tr -d '@')
          name=$(echo "$pkg" | awk -F/ '{print $2}')
          echo "--- JSR version API for ${pkg}@${ver} ---"
          curl -fsS "https://jsr.io/api/scopes/${scope}/packages/${name}/versions/${ver}" -o /tmp/version.json -w 'http=%{http_code}\n' || echo "(probe failed)"
          jq '{version, rekorLogId, usesNpm}' /tmp/version.json 2>/dev/null || cat /tmp/version.json
          echo "--- last 60 lines of /tmp/publish.log ---"
          tail -n 60 /tmp/publish.log 2>/dev/null || true
          echo "--- last 60 lines of /tmp/diagnose.log ---"
          tail -n 60 /tmp/diagnose.log 2>/dev/null || true

  publish-wrappers:
    name: publish-wrappers (${{ matrix.package }})
    needs: publish-deps
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/wrappers/hono
          - packages/wrappers/oak
    steps:
      - name: Checkout CI run commit
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - uses: ./.github/actions/publish-package
        with:
          package: ${{ matrix.package }}

      - name: Inspect published version
        if: always()
        shell: bash
        working-directory: ${{ matrix.package }}
        run: |
          pkg=$(jq -r '.name' deno.json)
          ver=$(jq -r '.version' deno.json)
          scope=$(echo "$pkg" | awk -F/ '{print $1}' | tr -d '@')
          name=$(echo "$pkg" | awk -F/ '{print $2}')
          echo "--- JSR version API for ${pkg}@${ver} ---"
          curl -fsS "https://jsr.io/api/scopes/${scope}/packages/${name}/versions/${ver}" -o /tmp/version.json -w 'http=%{http_code}\n' || echo "(probe failed)"
          jq '{version, rekorLogId, usesNpm}' /tmp/version.json 2>/dev/null || cat /tmp/version.json
          echo "--- last 60 lines of /tmp/publish.log ---"
          tail -n 60 /tmp/publish.log 2>/dev/null || true
          echo "--- last 60 lines of /tmp/diagnose.log ---"
          tail -n 60 /tmp/diagnose.log 2>/dev/null || true
