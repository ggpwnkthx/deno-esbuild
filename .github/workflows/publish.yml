name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace member to publish (empty for all)"
        required: false
        type: string

env:
  DENO_VERSION: "2.9.4"

jobs:
  publish:
    name: publish (${{ matrix.package }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/esbuild
          - package: packages/wrappers/shared
          - package: packages/plugins/deno
          - package: packages/plugins/css
          - package: packages/wrappers/hono
          - package: packages/wrappers/oak
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Select package
        if: ${{ inputs.package != '' && inputs.package != matrix.package }}
        run: echo "Skipping ${{ matrix.package }} (selected: ${{ inputs.package }})" && exit 0

      - name: Publish
        if: ${{ inputs.package == '' || inputs.package == matrix.package }}
        working-directory: ${{ matrix.package }}
        run: deno publish
